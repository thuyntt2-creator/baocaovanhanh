name: GTC Ca1 TTS Daily Report

on:
  schedule:
    # Chạy lúc 00:00 UTC (07:00 giờ VN) mỗi ngày
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép chạy bằng tay từ giao diện GitHub

jobs:
  run-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Install Playwright browsers
        run: playwright install chromium
          
      - name: Create credentials.json
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          
      - name: Run Download Script (Looker Studio to Google Sheet)
        env:
          GHN_COOKIES: ${{ secrets.GHN_COOKIES }}
        run: python download_report_gtc_ca1_tts.py
          
      - name: Run Calculate & Report Script (Google Sheet to GTalk)
        env:
          GTALK_OA_TOKEN: ${{ secrets.GTALK_OA_TOKEN }}
          GTALK_CHANNEL_ID: ${{ secrets.GTALK_CHANNEL_ID }}
        run: python calculate_gtc_ca1_tts.py
